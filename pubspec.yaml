name: classmate
description: "ClassMate - Student Planner App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  timezone: ^0.9.4
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon_light.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/icon_light.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/icon_light.png"
  color_dark: "#0F172A"
  image_dark: "assets/icon/icon_dark.png"
  android: true
  ios: false
  android_gravity: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon_light.png
    - assets/icon/icon_dark.png
    - assets/icon/icon_monochrome.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
